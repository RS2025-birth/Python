name: bank-api-platform

services:
  mock_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-mock-api
    command: ["uvicorn", "apps.mock_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_EXTERNAL_API_BASE_URL: "http://localhost:8000"
      APP_AUTH_HEADER_NAME: "Authorization"
      APP_AUTH_HEADER_VALUE: "mock-internal-dummy"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  sample_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-sample-api
    command: ["uvicorn", "apps.sample_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_EXTERNAL_API_BASE_URL: "http://mock_api:8000"
      APP_CONNECT_TIMEOUT: ${APP_CONNECT_TIMEOUT:-5.0}
      APP_READ_TIMEOUT: ${APP_READ_TIMEOUT:-30.0}
      APP_MAX_RETRIES: ${APP_MAX_RETRIES:-2}
      APP_AUTH_HEADER_NAME: ${APP_AUTH_HEADER_NAME:-Authorization}
      APP_AUTH_HEADER_VALUE: ${APP_AUTH_HEADER_VALUE:-Bearer local-compose-token}
    depends_on:
      mock_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
