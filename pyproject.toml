
[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "common-platform"
version = "0.1.0"
description = "Common platform and FastAPI applications"
readme = "README.md"
requires-python = ">=3.12,<3.16"

dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "httpx>=0.27.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.12.0",
]

# --------------------------------------------------
# 開発・テスト用ツール
# --------------------------------------------------
[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "poethepoet>=0.37.0",
    "httpx2>=2.16.0",
    "build>=1.2.0",
]

# --------------------------------------------------
# setuptools: srcレイアウト・パッケージ探索
# --------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["common_platform*"]

# --------------------------------------------------
# pytest
# --------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src", "apps", "."]
testpaths = [
    "tests/unit",
    "tests/integration",
]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_default_fixture_loop_scope = "function"

# --------------------------------------------------
# Ruff: Linter / Formatter
# --------------------------------------------------
[tool.ruff]
target-version = "py315"
src = ["src", "apps", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------
# mypy: Type Checker
# --------------------------------------------------
[tool.mypy]
python_version = "3.15"
mypy_path = ["src"]
explicit_package_bases = true
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
show_error_codes = true
pretty = true
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false

# --------------------------------------------------
# Poe: 開発コマンド
# --------------------------------------------------
[tool.poe.tasks]

lint = "ruff check ."

format = "ruff format ."

format-check = "ruff format --check ."

typecheck = "mypy src apps tests"

test = "pytest"

test-unit = "pytest tests/unit"

test-int = "pytest tests/integration"

# 全チェック
check = [
    "lint",
    "format-check",
    "typecheck",
    "test",
]

# サンプルAPI起動
run-sample = "uvicorn sample_api.main:app --reload --port 8000"

# モックAPI起動
run-mock = "uvicorn mock_api.main:app --reload --port 8001"

[tool.pyright]
extraPaths = ["src", "apps"]